<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - Fundamentals of Computing</title>

	<div class="column">

        <div class="bmi-container">

            <h2>BMI Calculator for Adults</h2>

            <p>For adults age 20 and older.</p>

            <label for="weight">Weight (kg):</label>

            <input type="number" id="weight" placeholder="Enter weight">

            <label for="height">Height (m):</label>

            <input type="number" id="height" placeholder="Enter height" step="0.01">

            <button type="button" onclick="calculateBMI()">
                Calculate BMI
            </button>

            <p id="result"></p>

        </div>

    </div>

</div>

<script>

function calculateBMI() {

    let weight = document.getElementById("weight").value;
    let height = document.getElementById("height").value;

    if (weight == "" || height == "") {

        document.getElementById("result").innerHTML =
            "Please enter both weight and height.";

    } else {

        let bmi = weight / (height * height);
        let category;

        if (bmi < 18.5) {
            category = "Underweight";
        } else if (bmi < 25) {
            category = "Healthy weight";
        } else if (bmi < 30) {
            category = "Overweight";
        } else {
            category = "Obesity";
        }

        document.getElementById("result").innerHTML =
            "BMI: " + bmi.toFixed(1) + "<br>Category: " + category;
    }

}

</script>

</body>
</html>
